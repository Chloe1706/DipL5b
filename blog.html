<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chloe Marrs — Blog</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #f5f4f0;
  --ink:       #1a1a1e;
  --ink-mid:   rgba(26,26,30,0.52);
  --ink-dim:   rgba(26,26,30,0.36);
  --font-serif:'Georgia', 'Times New Roman', serif;
  --font-sans: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --nav-h:     56px;
}

html, body { height: 100%; margin: 0; }
body { font-family: var(--font-sans); background: var(--bg); color: var(--ink); }

/* Nav */
#main-nav {
  position: fixed; top: 0; left: 0; right: 0;
  height: var(--nav-h);
  z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 40px;
}

#main-nav .nav-name {
  font-family: var(--font-serif);
  font-size: 13px; letter-spacing: 0.02em;
  color: var(--ink-mid);
  text-decoration: none;
}

#main-nav ul {
  list-style: none; display: flex; gap: 0;
  background: rgba(26,26,30,0.07);
  border: 1px solid rgba(26,26,30,0.14);
  border-radius: 999px; padding: 6px 18px;
}

#main-nav ul li + li { margin-left: 24px; }

#main-nav ul a {
  font-size: 11.5px; letter-spacing: 0.06em;
  text-decoration: none; color: var(--ink);
  opacity: 0.65; transition: opacity 0.2s;
}

#main-nav ul a:hover { opacity: 1; }

/* Burger */
#burger {
  display: none; flex-direction: column;
  justify-content: center; gap: 5px;
  width: 36px; height: 36px;
  background: none; border: none; cursor: pointer; padding: 4px;
}

#burger span {
  display: block; width: 22px; height: 1.5px;
  background: var(--ink); border-radius: 2px;
  transition: transform 0.25s ease, opacity 0.2s ease;
  transform-origin: center;
}

#burger.open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
#burger.open span:nth-child(2) { opacity: 0; }
#burger.open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

#mobile-drawer {
  display: none; position: fixed; inset: 0; z-index: 150;
  background: rgba(212,212,74,0.96); backdrop-filter: blur(12px);
  flex-direction: column; align-items: center; justify-content: center; gap: 36px;
  opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
}

#mobile-drawer.open { opacity: 1; pointer-events: all; }

#mobile-drawer a {
  font-family: var(--font-serif); font-size: clamp(1.4rem, 6vw, 2rem);
  text-decoration: none; color: var(--ink); opacity: 0.75; transition: opacity 0.2s;
}

#mobile-drawer a:hover { opacity: 1; }

/* Content */
.page-content {
  max-width: 680px;
  margin: 0 auto;
  padding: calc(var(--nav-h) + 80px) 40px 120px;
}

.page-content h1 {
  font-family: var(--font-serif);
  font-size: clamp(2rem, 4vw, 3rem);
  font-weight: normal; color: var(--ink);
  margin-bottom: 16px; letter-spacing: -0.01em;
}

.page-content p {
  font-size: 15px; line-height: 1.8;
  color: var(--ink-mid);
}

/* Responsive */
@media (max-width: 600px) {
  #main-nav { padding: 0 20px; }
  #main-nav ul { display: none; }
  #burger { display: flex; }
  #mobile-drawer { display: flex; }
  .page-content { padding: calc(var(--nav-h) + 48px) 20px 80px; }
}
</style>
</head>
<body>

<nav id="main-nav">
  <span class="nav-name">Chloe Marrs</span>
  <ul>
    <li><a href="index.html">About Me</a></li>
    <li><a href="portfolio.html">Previous Work</a></li>
    <li><a href="blog.html">Blog</a></li>
  </ul>
  <button id="burger" aria-label="Open navigation menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
</nav>

<div id="mobile-drawer" role="dialog" aria-label="Navigation">
  <a href="index.html"     class="drawer-link">About Me</a>
  <a href="portfolio.html" class="drawer-link">Previous Work</a>
  <a href="blog.html"      class="drawer-link">Blog</a>
</div>

<main class="page-content">
  <h1>Blog</h1>
  <p>Coming soon.</p>
</main>

<script>
const burgerBtn = document.getElementById('burger');
const drawer    = document.getElementById('mobile-drawer');

function toggleDrawer(open) {
  burgerBtn.classList.toggle('open', open);
  drawer.classList.toggle('open', open);
  burgerBtn.setAttribute('aria-expanded', open);
  document.body.style.overflow = open ? 'hidden' : '';
}

burgerBtn.addEventListener('click', () => toggleDrawer(!burgerBtn.classList.contains('open')));
document.querySelectorAll('.drawer-link').forEach(l => l.addEventListener('click', () => toggleDrawer(false)));
document.addEventListener('keydown', e => { if (e.key === 'Escape') toggleDrawer(false); });
</script>
</body>
</html>
